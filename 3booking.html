<body>

      <a href="index.html">

  <main>

    <form
      action="https://formspree.io/f/mzdneegy"
      method="POST"
    >
      <h2>Book Your Training Session</h2>

      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
      >

      <label for="player-age">Player Age</label>
      <input
        type="number"
        id="player-age"
        name="player_age"
        min="5"
        max="99"
      >

      <label for="plan">Choose Plan</label>
      <select id="plan" name="plan" required>
        <option value="">Select a plan</option>
        <option value="Newcomer Free Session">
          Newcomer Free Session
        </option>
        <option value="Single Group Session">
          Single Group Session
        </option>
        <option value="Four Group Sessions">
          Four Group Sessions
        </option>
        <option value="Private Training">
          Private Training
        </option>
      </select>

      <label for="preferred-date">Preferred Training Date</label>
      <input
        type="date"
        id="preferred-date"
        name="preferred_date"
      >

      <label for="message">Message</label>
      <textarea
        id="message"
        name="message"
        rows="4"
        placeholder="Tell me about the player's experience, goals, and availability."
      ></textarea>

      <input
        type="hidden"
        name="_subject"
        value="New GH Basketball Training Booking"
      >

      <button type="submit">Submit Booking</button>
    </form>
